<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wok & Ember — Dapur Rush</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #121214;
      color: #f4f4f5;
      font-family: "Trebuchet MS", Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 1280px;
      height: 800px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      background: #1e1e24;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #fdfbf7;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="1280" height="800"></canvas>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
